  probed: GET https://community.khoros.com/api/2.0/search (anonymous) -> HTTP 403
  code_field: data.code
  note: Carries a Khoros-specific numeric code independent of the HTTP status.
- product: Khoros Community v1
  media_type: text/xml
  example: <response status="error"><error code="501"><message>Unknown path element at node 'community.messages'.</message></error></response>
  probed: GET https://community.khoros.com/restapi/vc/messages/count -> HTTP 200
  code_field: response/error/@code
  note: Returned with HTTP 200 — the transport status does not reflect the outcome, so clients must parse
    response/@status.
