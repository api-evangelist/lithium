description: Khoros does not use RFC 9457 problem+json anywhere. Error responses are declared as application/json
  or text/plain with product-specific bodies, and the two Community APIs use two different envelopes again
  — a JSON envelope with its own numeric code on v2, and an XML document returned under HTTP 200 on v1.
  The table below is what the machine-readable contracts actually declare; there is no published platform-wide
  error-code registry.
