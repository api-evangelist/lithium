generated: '2026-07-19'
method: derived
source: Derived from the path structure, path parameters and server base URLs of the 28 harvested definitions
  in ../openapi/.
description: The Lithium / Khoros surface has no single data model. It is four product APIs with separate
  object graphs — Care is built around conversations, authors and work queues; Marketing around conversations,
  streams and CRM records; Flow around threads, messages and flows; Community around the LiQL collections
  (messages, users, boards, categories, replies). Because most Care definitions are single-resource specs
  served from a resource-specific host, entity boundaries are derived from server base URLs and path structure
  rather than from shared components.schemas — only securitySchemes are declared in components across
  the whole set, so there is no $ref graph to walk.
caveats:
- None of the 28 definitions declares components.schemas, so no schema $ref graph exists to derive from.
  Request and response shapes are declared inline.
- Relationships below are inferred from path nesting and id parameter naming, not from a published object
  reference.
- The Community v2 object model (the LiQL collections) is documented behind the Atlas login and could
  not be harvested.
products:
  care: Conversations, authors, agent states, tags and tag rules, smart views, work queues, bots, listening,
    secure forms, GDPR requests, analytics reports.
  marketing: Conversations, CRM records, label sets, streams, event subscriptions, analytics.
  flow: Flows, threads, messages, events, broadcasts, audience segments, business hours.
  community: LiQL collections — messages, users, boards, categories, replies (documentation login-gated).
