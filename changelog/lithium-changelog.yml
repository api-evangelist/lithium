breaking_change_signal:
  mechanism: URI-path major versioning (v1 -> v2 -> v3 run in parallel)
  note: >-
    Khoros does not publish a machine-readable breaking-change feed. Major versions are
    introduced as new path segments and older majors continue to be documented alongside
    them — see ../lifecycle/lithium-lifecycle.yml.
