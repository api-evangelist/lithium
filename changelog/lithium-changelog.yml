generated: '2026-07-19'
method: searched
source: >-
  The three public ReadMe changelogs on developer.khoros.com — Khoros Care, Khoros Flow and
  Khoros Brand Messenger. Entry dates are the publication timestamps carried in each
  changelog index.
description: >-
  Khoros publishes a per-product changelog rather than one platform-wide release feed. Three
  of the four public developer projects have a dated changelog; Khoros Marketing does not
  publish one. Cadence is uneven — Brand Messenger releases on an SDK-version cadence, Care
  and Flow publish occasional dated release notes, and the most recent entry across all
  three is December 2024, so this is a slow-moving surface.

