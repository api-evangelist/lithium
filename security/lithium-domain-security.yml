description: Live TLS/DNS posture across the Khoros, Lithium, Spredfast and flow.ai hosts this provider
  spans. The headline finding is that the legacy lithium.com apex — still the company's original domain
  and still serving the Khoros marketing site — presents a TLS certificate that expired on 3 January 2026,
  so every modern client refuses the connection. HSTS coverage is inconsistent and no domain in the estate
  is DNSSEC-signed.
findings:
- lithium.com and www.lithium.com serve an expired TLS certificate (expired 2026-01-03) while asserting
  HSTS with a one-year max-age — browsers that have seen the header cannot click through.
- No domain in the estate (khoros.ai, khoros.com, lithium.com, spredfast.com, flow.ai) is DNSSEC-signed.
- CAA records exist only on khoros.com and flow.ai; khoros.ai, lithium.com and spredfast.com publish none.
- khoros.ai DMARC policy is p=none (monitor only) while khoros.com, lithium.com and spredfast.com are
  p=reject — the primary brand domain is the weakest of the set.
- HSTS is absent on every API host except community.khoros.com, including the OAuth authorization server
  login.spredfast.com.
