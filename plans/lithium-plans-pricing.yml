plan_count: 0
description: >-
  Khoros publishes no plans, no tiers and no prices. There is no pricing page on khoros.ai,
  no pricing or quota page anywhere in the developer documentation, and no machine-readable
  pricing or catalog endpoint. Every route to a number ends at a sales conversation. The
  commercial model reported by resellers and buyers is per-seat enterprise licensing —
  Khoros Care priced per agent seat, Communities and Marketing priced per user seat with
  volume discounts and annual commitments — but Khoros itself states none of that publicly,
  so nothing here is recorded as a published plan.

