safety_notes:
- 'No Idempotency-Key support: a retried write tool call can duplicate a message, tag or subscription.'
- Khoros Care rate limits are 60 calls per 60 seconds (Author/Conversation) and 20 per minute (Analytics
  Reports) with no rate-limit response headers, so a client must throttle itself.
- Marketing tools act on a tenant identified by the x-sf-company-id / x-sf-initiative / x-sf-user-email
  headers — these must be bound per connection, not chosen by the agent.
- The GDPR API performs data-subject erasure; it should be gated behind explicit human approval.
