description: 'Khoros does not ship an MCP server. This is a candidate tool surface derived from the published
  operations, not a Khoros product. Anyone building it should note three things from ../conventions/lithium-conventions.yml:
  there is no idempotency contract, so write tools must not be retried blindly; authentication differs
  per product (Basic and JWT for Care, OAuth 2.0 for Marketing, API app credentials for Community); and
  the only OAuth scope available is `all`, which is read/write, so a read-only agent cannot be enforced
  at the token level and must be constrained by tool selection instead.'
