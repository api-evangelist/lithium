method: searched
source: >-
  Live unauthenticated reads of registry.npmjs.org and pypi.org/pypi/<pkg>/json for every
  registry-published package, plus api.github.com repo + tag metadata for the
  GitHub-distributed mobile SDKs in the github.com/lithiumtech organization (GitHub-verified,
  display name "Khoros"). First-party status is asserted only where the npm maintainer set or
  the repository owner resolves to lithiumtech / flow-ai / an IgniteTech-Trilogy distribution
  account.
description: >-
  Client libraries and SDKs for the Lithium / Khoros platform. The Community plugin SDK still
  ships under the original `lithium-sdk` name and carries the `li` CLI (see
  ../cli/lithium-cli.yml). Brand Messenger ships native iOS, Android, React Native and Flutter
  SDKs; Khoros Flow ships the flow.ai JavaScript SDK and message templates; the Aurora
  community platform ships `khoros-aurora-sdk`. Currency is uneven: only `khoros-aurora-sdk`
  and the Brand Messenger distributions have shipped in 2026. The two SDKs that carry the
  Lithium name itself — `lithium-sdk` (npm, 1.11.0, last published 2022-10-31) and
  `li-android-sdk` (last tag v1.2.0, repo last pushed 2023-05) — have not been released in
  over three years while the APIs they wrap are still documented and served.

