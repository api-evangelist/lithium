  still ships under the original `lithium-sdk` name and carries the `li` CLI (see
  ../cli/lithium-cli.yml). Brand Messenger ships native iOS, Android, React Native and
  Flutter SDKs; Khoros Flow ships the flow.ai JavaScript SDK and message templates; the
  Aurora community platform ships `khoros-aurora-sdk`.

