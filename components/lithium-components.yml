generated: '2026-07-19'
method: searched
source: >-
  https://developer.khoros.com/khorosbrandmessengerdocs/docs (Brand Messenger / Modern
  Chat), https://khoros.ai/developer/ (Community Plugin SDK, Customization Framework),
  https://khoros.ai/aurora/technical-overview/ (Aurora SDK plugin points), and the
  distribution repositories in the github.com/lithiumtech organization.
description: >-
  Client-side and embeddable surfaces for the Lithium / Khoros platform. Distinct from the
  server-side API clients in ../packages/. Three families: the embeddable Brand Messenger
  chat widget and its native mobile SDKs, the Community customization framework (FreeMarker
  components and skins built with the `li` CLI), and the Aurora SDK's React-based plugin
  points.

families:
  - family: Brand Messenger
    description: >-
      Khoros' embeddable customer-messaging surface ("Modern Chat") — a hosted chat widget
      for web plus native SDKs that embed the same conversation experience in mobile apps.
      Conversations raised through it land in the Khoros Care agent workspace.
    docs: https://developer.khoros.com/khorosbrandmessengerdocs/docs/modern-chat
    changelog: https://developer.khoros.com/khorosbrandmessengerdocs/changelog
    components:
      - name: Brand Messenger iOS SDK
        platform: ios
        repository: https://github.com/lithiumtech/ios-brandmessenger-sdk-dist
        version_seen: 1.16.2
      - name: Brand Messenger Android SDK
        platform: android
        repository: https://github.com/lithiumtech/android-brandmessenger-sdk-dist
        version_seen: 1.16.1
      - name: Brand Messenger React Native SDK
        platform: react-native
        loader: react-native-brandmessenger-sdk
        registry_url: https://www.npmjs.com/package/react-native-brandmessenger-sdk
        version_seen: 1.3.2
      - name: Brand Messenger Flutter SDK
        platform: flutter
        repository: https://github.com/lithiumtech/flutter_brandmessenger_sdk

  - family: Community Customization Framework
    description: >-
      The Lithium Community plugin model: FreeMarker components and context objects, custom
      pages, skins/themes and endpoints, packaged and deployed with the `li` CLI. This is
      the long-standing Lithium extensibility surface.
    docs: https://developer.khoros.com/khoroscommunitydevdocs/docs/development-guides
    reference: https://developer.khoros.com/khoroscommunitydevdocs/reference/freemarker-context-object-index
    docs_access: login-required (Atlas)
    components:
      - name: Community Plugin SDK
        loader: lithium-sdk
        registry_url: https://www.npmjs.com/package/lithium-sdk
        cli: ../cli/lithium-cli.yml
      - name: FreeMarker components and context objects
        description: Server-rendered component/templating layer for community pages.
      - name: Skins and themes
        description: Skin inheritance and theme overrides for community look and feel.

  - family: Aurora SDK
    description: >-
      The plugin surface for Aurora, the newer React + GraphQL community platform. Plugin
      points are customized from a Git repository and previewed against the community.
    docs: https://developer.khoros.com/khorosauroradevdocs/docs/installing-the-sdk
    docs_access: login-required (Atlas)
    components:
      - name: Aurora SDK
        loader: khoros-aurora-sdk
        registry_url: https://www.npmjs.com/package/khoros-aurora-sdk
        version_seen: 26.3.5
      - name: Theme overrides
        docs: https://developer.khoros.com/khorosauroradevdocs/docs/introduction-to-theme-overrides
      - name: Custom pages
        docs: https://developer.khoros.com/khorosauroradevdocs/docs/introduction-to-custom-pages

notes:
  - >-
    Community and Aurora developer documentation requires an Atlas (community.khoros.com)
    login; the URLs above return HTTP 403 to anonymous clients. Brand Messenger, Care,
    Marketing and Flow documentation is public.
