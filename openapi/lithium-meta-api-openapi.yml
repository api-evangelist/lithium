openapi: 3.2.0
info:
  title: agent-states-api-v2 AccountSet Meta API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: Meta
paths:
  /meta/object/{type}:
    get:
      summary: Define Object Structures
      description: Define object structures for a specified type
      operationId: define-object-structures
      parameters:
      - name: type
        in: path
        description: Object name. **Allowed Values:** `customer`, `case`
        schema:
          type: string
        required: true
      - name: x-sf-user-email
        in: header
        description: The email ID of the Khoros Care agent performing the action.
        schema:
          type: string
      - name: x-sf-company-id
        in: header
        description: The Khoros Care ID of the company the user is in when making the request.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Meta
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: false
x-readme-fauxas: true
