openapi: 3.2.0
info:
  title: Lithium Meta API
  version: '1.1'
  description: 'Operations tagged Meta across 2 of this provider''s published API definitions: lithium-care-api-specifications-openapi.json, lithium-marketing-api-specifications-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{your-domain}.com
  variables:
    your-domain:
      default: your-domain
security:
- {}
tags:
- name: Meta
paths:
  /meta/object/{type}:
    get:
      summary: Define Object Structures
      description: Define object structures for a specified type
      operationId: define-object-structures
      parameters:
      - name: type
        in: path
        description: Object name. **Allowed Values:** `customer`, `case`
        schema:
          type: string
        required: true
      - name: x-sf-user-email
        in: header
        description: The email ID of the Khoros Care agent performing the action.
        schema:
          type: string
      - name: x-sf-company-id
        in: header
        description: The Khoros Care ID of the company the user is in when making the request.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Meta
    servers:
    - url: https://{your-domain}.com
      variables:
        your-domain:
          default: your-domain
x-refined-from:
- lithium-care-api-specifications-openapi.json
- lithium-marketing-api-specifications-openapi.json
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: false
x-readme-fauxas: true
