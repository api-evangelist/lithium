openapi: 3.2.0
info:
  title: Lithium Customers API
  version: '1.1'
  description: 'Operations tagged Customers across 2 of this provider''s published API definitions: lithium-care-api-specifications-openapi.json, lithium-marketing-api-specifications-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{your-domain}.com
  variables:
    your-domain:
      default: your-domain
security:
- {}
tags:
- name: Customers
paths:
  /customers:
    post:
      summary: searchCustomers
      description: Find all customers matching the provided set of criteria
      operationId: searchcustomers
      parameters:
      - name: x-sf-user-email
        in: header
        description: The email ID of the Khoros Care agent performing the action.
        schema:
          type: string
      - name: x-sf-initiative
        in: header
        description: The ID of the active Khoros Care initiative the user is in when performing the action.
        schema:
          type: integer
          format: int32
      - name: x-sf-company-id
        in: header
        description: The Khoros Care ID of the company the user is in when making the request.
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customSearchableCustomerFieldOne:
                  type: string
                  description: 'An example of a custom field on the Customer object with `"searchable": true`. These will only be present if specified via the **/meta/object/customer endpoint**.'
                customSearchableCustomerFieldTwo:
                  type: string
                  description: 'An example of a custom field on the Customer object with `"searchable": true`. These will only be present if specified via the **/meta/object/customer endpoint**.'
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: See Details for Schema
        '401':
          description: '401'
          content:
            text/plain:
              examples:
                Result:
                  value: See Details for Schema
        '500':
          description: '500'
          content:
            text/plain:
              examples:
                Result:
                  value: See Details for Schema
      deprecated: false
      security: []
      tags:
      - Customers
    servers:
    - url: https://{your-domain}.com
      variables:
        your-domain:
          default: your-domain
