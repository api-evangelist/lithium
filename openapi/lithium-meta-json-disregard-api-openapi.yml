openapi: 3.1.0
info:
  title: agent-states-api-v2 AccountSet Meta.json?disregard API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: Meta.json?disregard
paths:
  /{account}/{streamName}/meta.json?disregard:
    get:
      summary: Get excluded trends from values
      description: Exclude trends that match supplied values from buckets while trying to ensure `num_trends` is met
      operationId: get-excluded-trends-from-values
      parameters:
      - name: account
        in: path
        schema:
          type: string
        required: true
      - name: streamName
        in: path
        schema:
          type: string
        required: true
      - name: disregard
        in: query
        schema:
          type: integer
          format: int32
          default: null
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: Coming Soon
      deprecated: false
      security: []
      tags:
      - Meta.json?disregard
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: false
x-readme-fauxas: true
