openapi: 3.2.0
info:
  title: agent-states-api-v2 AccountSet Messages API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: Messages
paths:
  /{integrationUuid}/messages/validation:
    post:
      summary: Validate JSON request of inbound messages
      description: Validate the JSON request of inbound messages
      operationId: integrationuuidmessagesvalidation
      parameters:
      - name: integrationUuid
        in: path
        description: The unique identifier of the social integration
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  description: The Raw JSON payload. Refer to [Listening API object definitions](ref:listening-api-object-definitions) to build your JSON.
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\":\"success\",\n  \"data\":[\n      \"z135g3jz2tm0x5uq23gerbpiybcbb4\"\n  ]\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: string
                      example: z135g3jz2tm0x5uq23gerbpiybcbb4
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      x-readme:
        code-samples:
        - language: http
          code: https://your_care_instance.lithium.com/api/v2/listening/fa600d27-dde1-4bdc-a3be-2f3edff236c7/messages/validation
          name: /integrationUuid/messages/validation Example
        samples-languages:
        - http
      tags:
      - Messages
  /{integrationUuid}/messages:
    post:
      summary: Create inbound messages
      description: Create inbound messages
      operationId: integrationuuiddiscussion
      parameters:
      - name: integrationUuid
        in: path
        description: The unique identifier of the social integration
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  description: The Raw JSON payload. Refer to [Listening API object definitions](ref:listening-api-object-definitions) to build your JSON.
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"status\":\"success\",\n  \"data\":[\n      \"z135g3jz2tm0x5uq23gerbpiybcbb4\"\n  ]\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: string
                      example: z135g3jz2tm0x5uq23gerbpiybcbb4
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      x-readme:
        code-samples:
        - language: http
          code: https://servername.response.lithium.com/api/v2/listening/fa600d27-dde1-4bdc-a3be-2f3edff236c7/messages
          name: /integrationUuid/messages Example
        samples-languages:
        - http
      tags:
      - Messages
    delete:
      summary: Delete messages
      description: Delete messages
      operationId: integrationuuidmessages-1
      parameters:
      - name: integrationUuid
        in: path
        description: The unique identifier of the social integration
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
