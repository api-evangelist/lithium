openapi: 3.2.0
info:
  title: agent-states-api-v2 AccountSet By Source Document ID API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: BySourceDocumentId
paths:
  /bySourceDocumentId/networks/{network}/instances/{instance}/id/{source document id}:
    get:
      summary: Get conversation details by document source ID
      description: Get conversation details by display ID
      operationId: get-conversation-details-by-document-source-id
      parameters:
      - name: network
        in: path
        description: The unique name of the network serving as the source channel for the conversation.
        schema:
          type: string
        required: true
      - name: instance
        in: path
        description: The unique name of the Khoros Care instance through which the conversation is managed.
        schema:
          type: string
        required: true
      - name: source document id
        in: path
        description: This is the unique ID given by the source channel for the document. (i.e. Facebook post)
        schema:
          type: string
        required: true
      responses:
        '200':
