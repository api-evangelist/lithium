openapi: 3.2.0
info:
  title: agent-states-api-v2 AccountSet Meta.json?precision API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: Meta.json?precision
paths:
  /{account}/{streamName}/meta.json?precision:
    get:
      summary: Get specific decimals in percent return
      description: Determines the number of decimal places to return in percentages
      operationId: get-specific-decimals-in-percent-return
      parameters:
      - name: account
        in: path
        schema:
          type: string
        required: true
      - name: streamName
        in: path
        schema:
          type: string
        required: true
      - name: precision
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: Coming Soon
      deprecated: false
      security: []
      tags:
      - Meta.json?precision
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: false
x-readme-fauxas: true
