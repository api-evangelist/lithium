openapi: 3.2.0
info:
  title: agent-states-api-v2 AccountSet Meta.json?all Topics API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: Meta.json?all Topics
paths:
  /{account}/{streamName}/meta.json?all_topics:
    get:
      summary: Get all topics
      description: Returns all topics, not just those with count > 0
      operationId: get-all-topics
      parameters:
      - name: account
        in: path
        schema:
          type: string
        required: true
      - name: streamName
        in: path
        schema:
          type: string
        required: true
      - name: all_topics
        in: query
        schema:
          type: integer
          format: int32
          default: 3
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: Coming Soon
      deprecated: false
      security: []
      tags:
      - Meta.json?all Topics
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: false
x-readme-fauxas: true
