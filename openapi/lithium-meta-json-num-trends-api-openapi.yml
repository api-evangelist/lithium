openapi: 3.2.0
info:
  title: agent-states-api-v2 AccountSet Meta.json?num Trends API
  version: '1.1'
servers:
- url: https://{instance}.response.lithium.com/api/v2/agentstate
  variables:
    instance:
      default: instance
security:
- {}
tags:
- name: Meta.json?num Trends
paths:
  /{account}/{streamName}/meta.json?num_trends:
    get:
      summary: Get number of topics
      description: Retrieves the number of topics (buckets).
      operationId: get-number-of-hashtags-returned
      parameters:
      - name: account
        in: path
        schema:
          type: string
        required: true
      - name: streamName
        in: path
        schema:
          type: string
        required: true
      - name: num_trends
        in: query
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: Coming Soon
      deprecated: false
      security: []
      tags:
      - Meta.json?num Trends
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: false
x-readme-fauxas: true
