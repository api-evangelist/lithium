generated: '2026-08-13'
method: probed
source: >-
  Live HTTP probes of the /.well-known/ discovery surface on every host in ../apis.yml
  (Website, DeveloperPortal, Documentation, and every corrected apis[].baseURL) plus every
  OpenAPI servers[] host that is not an instance-templated placeholder. Re-probed
  2026-08-13; the 2026-07-19 round is superseded.
description: >-
  Khoros publishes exactly one real /.well-known/ document: an RFC 9727 API catalog linkset
  at https://developer.khoros.com/.well-known/api-catalog, which returns HTTP 200 with
  content-type application/linkset+json and enumerates the Care, Marketing and Flow doc
  projects. It is a real document, not an SPA shell — but every `service-desc` link inside it
  (the machine-readable descriptor for each project) returns 404, so the catalog advertises
  three API descriptions that do not exist. Only the `service-doc` HTML reference links
  resolve. Nothing else is served: no security.txt, no OpenID/OAuth discovery, no
  ai-plugin.json, and no A2A agent card on any host. Two hosts return HTTP 200 for arbitrary
  paths — khoros.ai / www.khoros.com is a WordPress catch-all and developer.khoros.com is a
  ReadMe single-page app — so those 200s are recorded as soft-404s, not hits.

hits:
  - path: /.well-known/api-catalog
    host: developer.khoros.com
    status: 200
    content_type: application/linkset+json; charset=utf-8
    file: lithium-api-catalog.json
    spec: RFC 9727 (API catalog / linkset)
    real: true
    entries: 3
    anchors:
      - https://developer.khoros.com/khoroscaredevdocs
      - https://developer.khoros.com/khorosmarketingdevdocs
      - https://developer.khoros.com/khoros-flow
    defect: >-
      All three advertised service-desc URLs
      (https://developer.khoros.com/{project}/.well-known/api-catalog) return HTTP 404. The
      catalog is well-formed and correctly typed but points at machine-readable descriptors
      that are not served. The service-doc HTML links (/{project}/reference) return 301 and
      resolve.
    missing_projects:
      - khoroscommunitydevdocs
      - khorosbrandmessengerdocs
    note: >-
      Two of the five published doc projects — Community and Brand Messenger — are absent
      from the catalog, so it under-describes the estate as well as over-promising the
      descriptors.

hosts:
